name: Sync Prod GitOps

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing repo
        uses: actions/checkout@v4

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ju4nr3v0l/InfraPOCArgoPUllRequestGenerator
          token: ${{ github.token }}
          persist-credentials: false
          path: _infra

      - name: Render prod manifests in infra repo
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          TARGET_DIR="_infra/generated/environments/prod/landing"

          rm -rf "${TARGET_DIR}"
          mkdir -p "${TARGET_DIR}/site"

          cp site/index.html "${TARGET_DIR}/site/index.html"
          cp site/style.css "${TARGET_DIR}/site/style.css"

          cat > "${TARGET_DIR}/deployment.yaml" <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: landingpage
            labels:
              app: landingpage
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: landingpage
            template:
              metadata:
                labels:
                  app: landingpage
              spec:
                containers:
                  - name: nginx
                    image: nginx:1.27-alpine
                    ports:
                      - containerPort: 80
                    volumeMounts:
                      - name: content
                        mountPath: /usr/share/nginx/html
                        readOnly: true
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 3
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 10
                      periodSeconds: 20
                volumes:
                  - name: content
                    configMap:
                      name: landingpage-content
          EOF

          cat > "${TARGET_DIR}/service.yaml" <<'EOF'
          apiVersion: v1
          kind: Service
          metadata:
            name: landingpage
            labels:
              app: landingpage
          spec:
            selector:
              app: landingpage
            ports:
              - name: http
                port: 80
                targetPort: 80
          EOF

          cat > "${TARGET_DIR}/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: landing-prod

          resources:
            - deployment.yaml
            - service.yaml

          configMapGenerator:
            - name: landingpage-content
              files:
                - site/index.html
                - site/style.css

          commonAnnotations:
            release.argocd.io/source-sha: "${HEAD_SHA}"

          generatorOptions:
            disableNameSuffixHash: true
          EOF

      - name: Commit and push infra changes
        working-directory: _infra
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${INFRA_REPO_TOKEN}" ]]; then
            echo "::error title=Missing INFRA_REPO_TOKEN::Create the INFRA_REPO_TOKEN secret in the landing repository with write access to InfraPOCArgoPUllRequestGenerator."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${INFRA_REPO_TOKEN}@github.com/ju4nr3v0l/InfraPOCArgoPUllRequestGenerator.git"

          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi

          git add generated/environments/prod/landing
          git commit -m "Sync prod manifests from landing@${{ github.sha }}"
          git push origin main
