name: Sync Prod GitOps

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: juanmarulanda/landingpocargoprpreview

jobs:
  sync-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing repo
        uses: actions/checkout@v4

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ju4nr3v0l/InfraPOCArgoPUllRequestGenerator
          token: ${{ github.token }}
          persist-credentials: false
          path: _infra

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error title=Missing Docker Hub secrets::Create DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the landing repository Actions secrets."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push prod image
        id: build_prod_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:main-${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:prod-latest

      - name: Render prod manifests in infra repo
        env:
          HEAD_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build_prod_image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail

          TARGET_DIR="_infra/generated/environments/prod/landing"

          rm -rf "${TARGET_DIR}"
          mkdir -p "${TARGET_DIR}"

          cat > "${TARGET_DIR}/rollout.yaml" <<'EOF'
          apiVersion: argoproj.io/v1alpha1
          kind: Rollout
          metadata:
            name: landingpage
            labels:
              app: landingpage
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: landingpage
            strategy:
              blueGreen:
                activeService: landingpage-active
                previewService: landingpage-preview
                autoPromotionEnabled: false
                scaleDownDelaySeconds: 30
            template:
              metadata:
                labels:
                  app: landingpage
              spec:
                containers:
                  - name: landing
                    image: IMAGE_PLACEHOLDER
                    ports:
                      - containerPort: 80
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 3
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 10
                      periodSeconds: 20
          EOF

          sed -i.bak "s|IMAGE_PLACEHOLDER|${IMAGE_REPOSITORY}@${IMAGE_DIGEST}|g" "${TARGET_DIR}/rollout.yaml"
          rm "${TARGET_DIR}/rollout.yaml.bak"

          cat > "${TARGET_DIR}/service-active.yaml" <<'EOF'
          apiVersion: v1
          kind: Service
          metadata:
            name: landingpage-active
            labels:
              app: landingpage
          spec:
            selector:
              app: landingpage
            ports:
              - name: http
                port: 80
                targetPort: 80
          EOF

          cat > "${TARGET_DIR}/service-preview.yaml" <<'EOF'
          apiVersion: v1
          kind: Service
          metadata:
            name: landingpage-preview
            labels:
              app: landingpage
          spec:
            selector:
              app: landingpage
            ports:
              - name: http
                port: 80
                targetPort: 80
          EOF

          cat > "${TARGET_DIR}/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: landing-prod

          resources:
            - rollout.yaml
            - service-active.yaml
            - service-preview.yaml

          commonAnnotations:
            release.argocd.io/source-sha: "${HEAD_SHA}"
            release.argocd.io/image-digest: "${IMAGE_DIGEST}"
          EOF

      - name: Commit and push infra changes
        working-directory: _infra
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${INFRA_REPO_TOKEN}" ]]; then
            echo "::error title=Missing INFRA_REPO_TOKEN::Create the INFRA_REPO_TOKEN secret in the landing repository with write access to InfraPOCArgoPUllRequestGenerator."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${INFRA_REPO_TOKEN}@github.com/ju4nr3v0l/InfraPOCArgoPUllRequestGenerator.git"

          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi

          git add generated/environments/prod/landing
          git commit -m "Sync prod manifests from landing@${{ github.sha }}"
          git pull --rebase origin main
          git push origin main
