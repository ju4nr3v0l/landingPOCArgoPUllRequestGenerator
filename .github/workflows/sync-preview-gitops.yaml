name: Sync Preview GitOps

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - closed

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: juanmarulanda/landingpocargoprpreview

jobs:
  sync-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing repo
        uses: actions/checkout@v4

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ju4nr3v0l/InfraPOCArgoPUllRequestGenerator
          token: ${{ github.token }}
          persist-credentials: false
          path: _infra

      - name: Resolve preview metadata
        id: preview_meta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HAS_PREVIEW_LABEL: ${{ contains(join(github.event.pull_request.labels.*.name, ','), 'preview') }}
        run: |
          set -euo pipefail

          PREVIEW_ID="pr-${PR_NUMBER}"
          BRANCH_SLUG="$(echo "${HEAD_REF}" | tr '/_' '-' | tr -cd '[:alnum:]-')"
          SHOULD_RENDER="false"

          if [[ "${PR_ACTION}" != "closed" && "${HAS_PREVIEW_LABEL}" == "true" ]]; then
            SHOULD_RENDER="true"
          fi

          {
            echo "preview_id=${PREVIEW_ID}"
            echo "branch_slug=${BRANCH_SLUG}"
            echo "should_render=${SHOULD_RENDER}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.preview_meta.outputs.should_render == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        if: steps.preview_meta.outputs.should_render == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Validate Docker Hub secrets
        if: steps.preview_meta.outputs.should_render == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error title=Missing Docker Hub secrets::Create DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the landing repository Actions secrets."
            exit 1
          fi

      - name: Login to Docker Hub
        if: steps.preview_meta.outputs.should_render == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push preview image
        if: steps.preview_meta.outputs.should_render == 'true'
        id: build_preview_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.preview_meta.outputs.preview_id }}-${{ github.event.pull_request.head.sha }}
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.preview_meta.outputs.preview_id }}-latest

      - name: Render preview manifests in infra repo
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_AZURE_CLIENT_ID: ${{ vars.PREVIEW_AZURE_CLIENT_ID }}
          SHOULD_RENDER: ${{ steps.preview_meta.outputs.should_render }}
          PREVIEW_ID: ${{ steps.preview_meta.outputs.preview_id }}
          BRANCH_SLUG: ${{ steps.preview_meta.outputs.branch_slug }}
          IMAGE_DIGEST: ${{ steps.build_preview_image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail

          TARGET_DIR="_infra/generated/previews/${PREVIEW_ID}"

          if [[ "${SHOULD_RENDER}" != "true" ]]; then
            rm -rf "${TARGET_DIR}"
            exit 0
          fi

          mkdir -p "${TARGET_DIR}"

          cat > "${TARGET_DIR}/deployment.yaml" <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: landingpage
            labels:
              app: landingpage
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: landingpage
            template:
              metadata:
                labels:
                  app: landingpage
              spec:
                serviceAccountName: landing-preview
                containers:
                  - name: landing
                    image: IMAGE_PLACEHOLDER
                    ports:
                      - containerPort: 80
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 3
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 10
                      periodSeconds: 20
          EOF

          sed -i.bak "s|IMAGE_PLACEHOLDER|${IMAGE_REPOSITORY}@${IMAGE_DIGEST}|g" "${TARGET_DIR}/deployment.yaml"
          rm "${TARGET_DIR}/deployment.yaml.bak"

          cat > "${TARGET_DIR}/service.yaml" <<'EOF'
          apiVersion: v1
          kind: Service
          metadata:
            name: landingpage
            labels:
              app: landingpage
          spec:
            selector:
              app: landingpage
            ports:
              - name: http
                port: 80
                targetPort: 80
          EOF

          if [[ -n "${PREVIEW_AZURE_CLIENT_ID}" ]]; then
            cat > "${TARGET_DIR}/serviceaccount.yaml" <<EOF
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: landing-preview
            annotations:
              azure.workload.identity/client-id: "${PREVIEW_AZURE_CLIENT_ID}"
          EOF
          else
            cat > "${TARGET_DIR}/serviceaccount.yaml" <<'EOF'
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: landing-preview
            annotations:
              preview.argocd.io/service-account-example: "true"
          EOF
          fi

          cat > "${TARGET_DIR}/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: preview-${PREVIEW_ID}

          resources:
            - deployment.yaml
            - service.yaml
            - serviceaccount.yaml

          commonAnnotations:
            preview.argocd.io/pr-number: "${PR_NUMBER}"
            preview.argocd.io/branch: "${BRANCH_SLUG}"
            preview.argocd.io/head-sha: "${HEAD_SHA}"
            preview.argocd.io/image-digest: "${IMAGE_DIGEST}"

          nameSuffix: "-${PREVIEW_ID}"
          EOF

      - name: Commit and push infra changes
        working-directory: _infra
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${INFRA_REPO_TOKEN}" ]]; then
            echo "::error title=Missing INFRA_REPO_TOKEN::Create the INFRA_REPO_TOKEN secret in the landing repository with write access to InfraPOCArgoPUllRequestGenerator."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${INFRA_REPO_TOKEN}@github.com/ju4nr3v0l/InfraPOCArgoPUllRequestGenerator.git"

          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi

          git add generated/previews
          git commit -m "Sync preview manifests for PR #${{ github.event.pull_request.number }}"
          git push origin main
